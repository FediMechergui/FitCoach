name: Verify
on:
  push:
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [Africa/Lagos, America/New_York, Asia/Kathmandu]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run verify:engines
      - run: npm run verify:repositories
      - run: npm run verify:upgrade
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backup-backend/package-lock.json
      - run: npm ci
        working-directory: backup-backend
      - run: npm test
        working-directory: backup-backend
